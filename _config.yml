# Author
author:
  name: Kamila Zhanuzak
  desc: Psychology Trainer
  email: kzhanuzak8@gmail.com
  selfie: assets/img/profile.jpg

# social
social:
  email: true
  behance:
  bitbucket:
  dribbble:
  facebook: 
  flickr:
  github: 
  google_plus:
  instagram:
  keybase:
